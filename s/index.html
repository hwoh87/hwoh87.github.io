<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>공유 결과 | 만세력</title>

  <!-- 카톡/인스타/메신저 리치 미리보기 (Open Graph) — 정적 공통.
       종류별 미리보기는 /s/<kind>/ OG 셸(fusion·compat·group·pair·gwansang)이 담당(정적 호스팅 한계 내 최대치). -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="만세력" />
  <meta property="og:title" content="사주 분석 결과를 공유받았어요 | 만세력" />
  <meta property="og:description" content="사주 · 자미두수 · 별자리 AI 융합 분석. 만세력 앱에서 내 사주로 직접 확인하세요." />
  <meta property="og:image" content="https://samra.cc/og-share.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://samra.cc/s/" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- 앱 세리프 정본(마루부리) — 한자 글리프가 없어 한자는 Noto Serif KR(600)이 받는다(앱 SealHanja 와 같은 역할). -->
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600&display=swap");
    @font-face{font-family:"MaruBuri";font-weight:400;font-display:swap;
      src:url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Regular.woff2) format("woff2")}
    @font-face{font-family:"MaruBuri";font-weight:600;font-display:swap;
      src:url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-SemiBold.woff2) format("woff2")}

    /* ── 앱 디자인 토큰 사본(단일 출처는 앱 AppDesignTokens — 근사치 금지) ──
       cosmicSpaceTop #08080d · cosmicSpaceDeep #120F19 · heroTitle #F4F1FF · heroBody rgba(255,255,255,.60)
       heroMeta rgba(255,255,255,.55) · cosmicGold #a78bfa · goldBright #c4b5fd · goldDeep #a78bfa
       CTA 골드 = 앱 tabAccent 채움의 웹 정합(180deg #a78bfa→#a78bfa→#7c3aed, onGold #08080d)
       종류별 본문 액센트(--acc)는 앱 SharedResultActivity 와 동일: 융합=aiAccent #7c3aed ·
       궁합/그룹=red #E58A80 · 관상=orangeDeep #7E6034 (JS 가 kind 에 맞춰 갱신) */
    :root { --acc: #7c3aed; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; background: #08080d; color: rgba(255,255,255,.60);
      font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    /* ── 씬/로딩/폴백 센터 카드(딥스페이스) ── */
    .center {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 32px;
    }
    .logo { font-size: 42px; }
    .center h1 { font-size: 20px; font-weight: 700; margin: 0; color: #F4F1FF; }
    .center p { font-size: 14px; line-height: 1.6; color: rgba(255,255,255,.55); margin: 0; max-width: 320px; }
    a.cta {
      display: inline-block; margin-top: 6px; padding: 13px 24px; border-radius: 14px;
      background: linear-gradient(180deg, #a78bfa, #a78bfa, #7c3aed);
      color:#fff; font-weight: 800; text-decoration: none; font-size: 14.5px;
      box-shadow: 0 6px 18px rgba(139,92,246,.30);
    }

    /* ── sid 스냅샷 뷰 ── */
    .wrap { display: none; }

    /* 코스믹 히어로 — 앱 딥스페이스 모먼트(테마 무관 고정) + 별가루(얼음빛+금빛) + 액센트 성운 */
    .hero {
      position: relative; overflow: hidden; text-align: center;
      background: radial-gradient(ellipse 120% 70% at 50% -10%, #191033 0%, #12101d 45%, #08080d 100%);
      padding: 30px 22px 42px;
    }
    .glow {
      /* 종류 액센트로 물드는 성운 — JS 가 kind 확정 후 색을 갱신(앱 히어로의 accent 글로우) */
      position: absolute; left: 50%; top: -80px; transform: translateX(-50%);
      width: 440px; height: 280px; border-radius: 50%; pointer-events: none;
      background: radial-gradient(closest-side, rgba(107, 78, 255, 0.20), transparent 70%);
    }
    .stars { position: absolute; inset: 0; pointer-events: none; }
    .star { position: absolute; border-radius: 50%; }
    .star.ice { background: #DCE6FF; }
    .star.gold { background: #c4b5fd; }
    .star.tw { animation: tw 3.2s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: 0.25; } 50% { opacity: 0.9; } }
    @media (prefers-reduced-motion: reduce) { .star.tw { animation: none; } }
    .hero-inner { position: relative; max-width: 720px; margin: 0 auto; }

    /* 상단 배지 행 — 골드 오버라인 + 읽기 전용 글래스 필(앱 SharedWelcomeHero 1행) */
    .hero-top {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-bottom: 22px; flex-wrap: wrap;
    }
    .ovl {
      font-size: 10.5px; letter-spacing: 0.14em; font-weight: 700; color: #c4b5fd;
      background: rgba(139,92,246,.16); border: 1px solid rgba(139,92,246,.50);
      border-radius: 8px; padding: 4px 10px;
    }
    .ro {
      font-size: 10.5px; font-weight: 700; color: rgba(255,255,255,.60);
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px; padding: 4px 10px;
    }

    .orb {
      width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 30px;
      color: #c4b5fd;
      background: radial-gradient(circle at 32% 28%, #191033, #08080d 70%);
      border: 1px solid rgba(167,139,250,.45);
      box-shadow: 0 0 26px rgba(139,92,246,.30), inset 0 0 16px rgba(139,92,246,.16);
    }
    .brand {
      font-size: 12px; letter-spacing: 0.18em; color: #a78bfa; font-weight: 700;
      text-transform: uppercase;
    }
    .subject {
      font-family: "MaruBuri", "Noto Serif KR", serif;
      font-size: 24px; font-weight: 600; margin: 12px 0 0; line-height: 1.45;
      letter-spacing: -0.01em; color: #F4F1FF;
    }
    .subject .accent { color: #c4b5fd; }
    .sig {
      margin: 18px auto 0; max-width: 560px;
      font-family: "MaruBuri", "Noto Serif KR", serif; font-weight: 400;
      font-size: 17.5px; line-height: 1.8; color: #F4F1FF;
    }
    .sig::before, .sig::after { color: #c4b5fd; font-size: 19px; }
    .sig::before { content: "“ "; }
    .sig::after { content: " ”"; }

    /* 종류/프라이버시 글래스 칩(앱 SharedHeroGlassChip) */
    .chiprow { display: flex; justify-content: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
    .gchip {
      font-size: 11.5px; font-weight: 600; color: rgba(255,255,255,.60);
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px; padding: 6px 11px;
    }

    /* 궁합 점수(스냅샷 뷰) — 히어로 안 골드 링 + 밴드 스케일(앱 ScoreBandScaleRow) */
    .scorering {
      width: 118px; height: 118px; margin: 22px auto 0; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative;
    }
    .scorering::before {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(#a78bfa calc(var(--pct) * 1%), rgba(255,255,255,.10) 0);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
    }
    .scorering .num { font-size: 38px; font-weight: 800; color: #c4b5fd; line-height: 1; }
    .scorering .unit { font-size: 12px; color: rgba(255,255,255,.55); margin-top: 6px; }
    .bandrow { display: flex; justify-content: center; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
    .band {
      font-size: 10.5px; font-weight: 700; color: rgba(255,255,255,.55);
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 999px; padding: 3px 9px;
    }
    .band.on { color: #ffffff; border-color: transparent; }

    .heroband {
      /* 히어로 → 페이퍼 이음새 */
      height: 18px; background: linear-gradient(#08080d, rgba(8,8,13,0));
      position: relative; z-index: 1; margin-bottom: -18px;
    }

    /* ── 웜 페이퍼 본문(앱 여명 배경 #0c0c14) — AI 리포트 본문은 앱 AiMarkdownText 와 같은 결 ── */
    .paper { background: #0c0c14; color: #F4F1FF; padding: 30px 22px 150px; }
    .paper-inner { max-width: 720px; margin: 0 auto; }
    .cardimg {
      width: 100%; border-radius: 18px; display: block; margin: 2px 0 18px;
      box-shadow: 0 10px 26px rgba(0,0,0,.35);
    }
    /* 섹션 헤딩 = 앱 SectionTitle(산세리프 굵게 + 종류 액센트, 장식 없음) */
    .report h2 {
      font-size: 17px; margin: 34px 0 10px; color: var(--acc); font-weight: 800; line-height: 1.5;
    }
    .report h2:first-child { margin-top: 4px; }
    .report h3 { font-size: 15.5px; margin: 24px 0 8px; color: var(--acc); font-weight: 700; }
    .report p { font-size: 15.5px; line-height: 1.78; color: #F4F1FF; margin: 0 0 16px; }
    /* 불릿 = 앱 액센트 도트(텍스트 "•" 가 아니라 6px 원) */
    .report ul { list-style: none; margin: 0 0 16px; padding-left: 10px; }
    .report li {
      position: relative; padding-left: 18px; font-size: 15.5px; line-height: 1.78;
      color: #F4F1FF; margin-bottom: 8px;
    }
    .report li::before {
      content: ""; position: absolute; left: 0; top: 11px; width: 6px; height: 6px;
      border-radius: 50%; background: var(--acc); opacity: 0.78;
    }
    .report strong { color: #ededed; }
    /* [[용어]] = 앱 용어 링크 표기(액센트 + 밑줄) */
    .term {
      color: var(--acc); font-weight: 600; text-decoration: underline;
      text-underline-offset: 3px; text-decoration-thickness: 1px;
    }

    /* 신뢰 카드(앱 SharedTrustCard — 딥네이비 메달리온 + 브랜드 한 줄) */
    .trust {
      display: flex; gap: 12px; align-items: center; background: #fff;
      border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 14px 15px; margin: 30px 0 0;
    }
    .trust .medal {
      width: 36px; height: 36px; border-radius: 12px; flex: none;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #08080d, #120F19); color: #c4b5fd; font-size: 15px;
    }
    .trust b { display: block; font-size: 13.5px; color: #ededed; }
    .trust span { display: block; font-size: 12.5px; color: rgba(255,255,255,.55); line-height: 1.55; margin-top: 2px; }

    /* 재공유(링크 복사) — 앱 하단 보조 버튼의 웹 대응 */
    .sharerow { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; }
    .copybtn {
      padding: 10px 16px; border: 1px solid #a78bfa; background: #fff; color: #a78bfa;
      border-radius: 999px; font-size: 13.5px; font-weight: 800; cursor: pointer;
    }
    .copymsg { font-size: 12.5px; color: rgba(255,255,255,.45); opacity: 0; transition: opacity 0.3s; }
    .copymsg.on { opacity: 1; }

    .meta {
      margin-top: 26px; padding-top: 14px; border-top: 1px solid rgba(51, 48, 43, 0.12);
      font-size: 12px; color: rgba(255,255,255,.45); line-height: 1.7;
    }

    /* 하단 고정 CTA 독 — 앱 스티키 독(여명 배경 페이드 + 골드 프라이머리) */
    .ctabar {
      position: fixed; left: 0; right: 0; bottom: 0; display: none;
      background: rgba(250, 245, 235, 0.96);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      border-top: 1px solid rgba(126, 99, 50, 0.18);
      padding: 10px 18px calc(10px + env(safe-area-inset-bottom));
    }
    .ctabar .inner { max-width: 720px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
    .ctabar .hint { flex: 1; font-size: 12.5px; line-height: 1.5; color: rgba(255,255,255,.55); min-width: 0; }
    .ctabar a.cta { margin-top: 0; padding: 13px 22px; font-size: 14px; white-space: nowrap; flex-shrink: 0; }

    /* ── 선물 포장 오버레이(?gift=1) — 딥스페이스 포장지. 로딩도 함께 가려준다. ── */
    .gift {
      position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 32px 24px;
      background: radial-gradient(120% 80% at 50% 0%, #191033 0%, #12101d 55%, #08080d 100%);
      transition: opacity .45s ease, visibility .45s;
    }
    .gift.off { opacity: 0; visibility: hidden; }
    .gift .g-orb {
      width: 96px; height: 96px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center;
      font-size: 44px; background: rgba(139,92,246,.16);
      border: 1.5px solid rgba(167,139,250,.45); margin-bottom: 22px;
      animation: giftFloat 2.6s ease-in-out infinite;
    }
    @keyframes giftFloat { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
    .gift .g-kicker { font-size: 12px; letter-spacing: .22em; color: #a78bfa; font-weight: 700; margin-bottom: 12px; }
    .gift h2 {
      font-family: "MaruBuri", "Noto Serif KR", serif;
      font-size: 24px; font-weight: 600; color: #F4F1FF; margin: 0 0 8px; line-height: 1.4;
    }
    .gift .g-sub { font-size: 14px; color: rgba(255,255,255,.55); line-height: 1.6; margin-bottom: 28px; }
    .gift .g-open {
      display: inline-block; padding: 14px 34px; border-radius: 14px; font-size: 15px; font-weight: 800;
      color:#fff; text-decoration: none; cursor: pointer; border: 0;
      background: linear-gradient(180deg, #a78bfa, #a78bfa, #7c3aed);
      box-shadow: 0 8px 26px rgba(139,92,246,.30);
    }
    .gift .g-note { margin-top: 16px; font-size: 11.5px; color: rgba(255,255,255,.55); }
  </style>
<script src="/assets/track.js" defer></script>
</head>
<body>
  <!-- sid 스냅샷 뷰(JS가 채움): 코스믹 히어로 + 웜 페이퍼 본문 -->
  <div class="wrap" id="snap">
    <div class="hero">
      <div class="glow" id="glow"></div>
      <div class="stars" id="stars"></div>
      <div class="hero-inner" id="heroInner"></div>
    </div>
    <div class="heroband"></div>
    <div class="paper"><div class="paper-inner" id="paperInner"></div></div>
  </div>
  <div class="ctabar" id="ctabar">
    <div class="inner">
      <div class="hint" id="ctahint">내 사주도 이렇게 깊이 분석받고 싶다면</div>
      <a id="ctabtn" class="cta" href="#" data-cta="store-s-viewer">앱에서 분석하기</a>
    </div>
  </div>

  <!-- 선물 포장 오버레이(?gift=1) — JS 가 열고 닫는다. 기본 숨김. -->
  <div class="gift off" id="gift">
    <div class="g-orb">🎁</div>
    <div class="g-kicker">SAJU GIFT</div>
    <h2 id="giftTitle">사주 선물이 도착했어요</h2>
    <div class="g-sub" id="giftSub">당신을 위해 만든 AI 사주 리포트예요.</div>
    <button class="g-open" id="giftOpen" type="button">선물 열어보기</button>
    <div class="g-note">만세력 — 삼라만상</div>
  </div>

  <!-- 씬 링크/로딩/폴백 센터 카드 -->
  <div class="center" id="center">
    <div class="logo">🔮</div>
    <h1 id="centerTitle">만세력</h1>
    <p id="centerDesc">결과를 불러오는 중이에요…</p>
    <a id="centerCta" class="cta" href="#" style="display:none" data-cta="store-s-center">앱에서 보기</a>
  </div>

  <script>
    (function () {
      var PKG = 'com.samramanshang.manseryeok';
      var API = 'https://sidxbzpbesbaiokxrqsf.supabase.co/functions/v1/s/';
      var params = new URLSearchParams(location.search);
      var sid = params.get('sid');
      var scene = params.get('scene');
      // 선물 프레이밍(?gift=1) — 리포트를 '포장지' 오버레이로 덮고 "선물 열어보기"로 개봉.
      //   sid 가 있을 때만 의미. 로딩 동안에도 포장지가 먼저 떠서 대기 시간을 연출로 흡수한다.
      var isGift = params.get('gift') === '1';
      var giftEl = document.getElementById('gift');
      if (isGift && sid) {
        giftEl.classList.remove('off');
        document.getElementById('giftOpen').addEventListener('click', function () {
          giftEl.classList.add('off');
        });
      }
      // 경로형(/s/one-to-one)도 지원(구링크 하위호환).
      if (!sid && !scene) { var m = location.pathname.match(/\/s\/([a-z-]+)/); if (m) scene = m[1]; }

      function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      function mdInline(s) {
        return esc(s)
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          // `[[계유|癸酉]]` 처럼 금지된 파이프 형식이 오면 앞부분만 용어로 남긴다(모델 간헐 위반).
          .replace(/\[\[([^\]|]+)\|[^\]]*\]\]/g, '<span class="term">$1</span>')
          .replace(/\[\[([^\]]+)\]\]/g, '<span class="term">$1</span>');
      }
      // AI 융합 본문이 실제로 쓰는 마크다운 부분집합만: #/##/### 헤딩, - 불릿, 빈 줄 단락, **굵게**, [[용어]].
      function mdToHtml(md) {
        var out = [], para = [], inList = false;
        function flushPara() { if (para.length) { out.push('<p>' + para.map(mdInline).join('<br />') + '</p>'); para = []; } }
        function closeList() { if (inList) { out.push('</ul>'); inList = false; } }
        md.split('\n').forEach(function (raw) {
          var line = raw.replace(/^\s+/, '');
          if (line.indexOf('### ') === 0) { flushPara(); closeList(); out.push('<h3>' + mdInline(line.slice(4)) + '</h3>'); }
          else if (line.indexOf('## ') === 0) { flushPara(); closeList(); out.push('<h2>' + mdInline(line.slice(3)) + '</h2>'); }
          else if (line.indexOf('# ') === 0) { flushPara(); closeList(); out.push('<h2>' + mdInline(line.slice(2)) + '</h2>'); }
          else if (line.indexOf('- ') === 0 || line.indexOf('* ') === 0) {
            flushPara();
            if (!inList) { out.push('<ul>'); inList = true; }
            out.push('<li>' + mdInline(line.slice(2)) + '</li>');
          } else if (line === '') { flushPara(); closeList(); }
          else { closeList(); para.push(line); }
        });
        flushPara(); closeList();
        return out.join('\n');
      }
      function storeUrl(ref) {
        return 'https://play.google.com/store/apps/details?id=' + PKG +
          (ref ? '&referrer=' + encodeURIComponent(ref) : '');
      }
      // 안드로이드 설치자: intent:// 로 앱 직행, 미설치자: 스토어 폴백. 그 외 플랫폼: 스토어.
      function ctaHref(store, sid) {
        var isAndroid = /android/i.test(navigator.userAgent);
        if (!isAndroid || !sid) return store;
        return 'intent://share/report?sid=' + encodeURIComponent(sid) +
          '#Intent;scheme=ohhyo;package=' + PKG +
          ';S.browser_fallback_url=' + encodeURIComponent(store) + ';end';
      }
      function showCenter(title, desc, ctaHref) {
        document.getElementById('centerTitle').textContent = title;
        document.getElementById('centerDesc').innerHTML = desc;
        var a = document.getElementById('centerCta');
        a.setAttribute('href', ctaHref);
        a.style.display = 'inline-block';
      }
      function hexRgba(hex, a) {
        var n = parseInt(hex.slice(1), 16);
        return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
      }
      // 별가루 — sid 시드 기반 결정적 배치(리로드마다 흔들리지 않게).
      //   앱 코스믹 캔버스와 같은 두 색: 얼음빛 #DCE6FF(잔별) + 금빛 #c4b5fd(굵은 별).
      function sprinkleStars(seedStr) {
        var host = document.getElementById('stars');
        var seed = 0;
        for (var i = 0; i < seedStr.length; i++) seed = (seed * 31 + seedStr.charCodeAt(i)) >>> 0;
        function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
        for (var n = 0; n < 46; n++) {
          var s = document.createElement('span');
          var isGold = rnd() < 0.28;
          var size = isGold ? 2.5 : 1.5;
          s.className = 'star ' + (isGold ? 'gold' : 'ice') + (rnd() < 0.4 ? ' tw' : '');
          s.style.width = size + 'px'; s.style.height = size + 'px';
          s.style.left = (rnd() * 100).toFixed(2) + '%';
          s.style.top = (rnd() * 100).toFixed(2) + '%';
          s.style.opacity = (0.25 + rnd() * 0.6).toFixed(2);
          if (s.className.indexOf('tw') >= 0) s.style.animationDelay = (rnd() * 3).toFixed(2) + 's';
          host.appendChild(s);
        }
      }
      // 상단 배지 행 + 글래스 칩(앱 SharedWelcomeHero 요소)
      function heroTop() {
        return '<div class="hero-top"><span class="ovl">공유받은 리포트</span>' +
          '<span class="ro">👁️ 읽기 전용</span></div>';
      }
      function glassChips(kindChip) {
        return '<div class="chiprow"><span class="gchip">' + kindChip + '</span>' +
          '<span class="gchip">🔒 생년월일은 담기지 않아요</span></div>';
      }
      function trustCard(sub) {
        return '<div class="trust"><div class="medal">✦</div><div>' +
          '<b>만세력 — 사주 · 자미두수 · 별자리 융합</b>' +
          '<span>' + sub + '</span></div></div>';
      }
      function shareRow() {
        return '<div class="sharerow"><button class="copybtn" id="copybtn" type="button">🔗 이 리포트 링크 복사</button>' +
          '<span class="copymsg" id="copymsg">링크를 복사했어요</span></div>';
      }
      function bindCopy() {
        var btn = document.getElementById('copybtn');
        if (!btn) return;
        btn.addEventListener('click', function () {
          var url = location.href;
          var done = function () {
            var msg = document.getElementById('copymsg');
            msg.classList.add('on');
            setTimeout(function () { msg.classList.remove('on'); }, 2200);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(done, done);
          } else {
            var ta = document.createElement('textarea');
            ta.value = url; document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta); done();
          }
        });
      }

      // ── sid 스냅샷: 서버 JSON 을 받아 웹에서 결과를 그대로 보여준다(자동 리다이렉트 없음) ──
      if (sid) {
        var store = storeUrl('sid_' + sid);
        fetch(API + encodeURIComponent(sid), { headers: { 'Accept': 'application/json' } })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (!d || d.expired) {
              // 만료/오류면 포장지를 걷는다 — 빈 선물 상자를 들려주지 않는다.
              giftEl.classList.add('off');
              showCenter('결과를 불러올 수 없어요', '링크가 만료되었거나 잘못된 주소일 수 있어요.<br />만세력 앱에서 내 사주로 직접 확인해 보세요.', store);
              return;
            }
            // 선물 포장지에 받는 사람 이름을 채운다(스냅샷 도착 후) — "○○님을 위해 만든 리포트".
            if (isGift && d.name_a) {
              document.getElementById('giftSub').textContent =
                d.name_a + '님을 위해 만든 AI 사주 리포트예요.';
            }
            var hero = '', paper = '', acc = '#7c3aed';
            // AI 리포트(ai-report + report_kind). 'saju-fusion' 은 일반화 이전 구행 하위호환.
            var isAiReport = (d.scene_type === 'ai-report' || d.scene_type === 'saju-fusion') && d.body_md;
            if (isAiReport) {
              // 종류별 브랜딩 + 본문 액센트 — 앱 SharedResultActivity 의 kind 분기와 동일 값.
              var KIND = {
                'fusion': {
                  glyph: '☯', label: 'AI 융합 해석', subjectSuffix: '님의 사주 리포트',
                  titleSuffix: '님의 사주 AI 융합 해석', acc: '#7c3aed',
                  chip: '🔮 AI 융합 해석',
                  meta: '이 리포트는 만세력 앱의 AI 융합 해석(사주 · 자미두수 · 별자리)으로 생성됐어요.',
                  hint: '내 사주도 이렇게 깊이 분석받고 싶다면',
                  trust: '내 사주로 분석하면 나의 명식 · 용신 · 흐름까지 이어져요.'
                },
                'compat': {
                  glyph: '💞', label: '1:1 궁합 AI 해석', subjectSuffix: ' 궁합 AI 리포트',
                  titleSuffix: ' 궁합 AI 해석', acc: '#E58A80',
                  chip: '💞 궁합 AI 해석',
                  meta: '이 리포트는 만세력 앱의 1:1 궁합 AI 해석(사주 기반)으로 생성됐어요.',
                  hint: '우리 궁합도 이렇게 깊이 보고 싶다면',
                  trust: '사주 · 자미두수 · 별자리를 한 앱에서. 내 사주로 보면 관계의 흐름·시기까지 이어져요.'
                },
                'group': {
                  glyph: '👥', label: '그룹 궁합 AI 해석', subjectSuffix: ' 그룹 궁합 리포트',
                  titleSuffix: ' 그룹 궁합 AI 해석', acc: '#E58A80',
                  chip: '👥 그룹 궁합 AI 해석',
                  meta: '이 리포트는 만세력 앱의 그룹 궁합 AI 해석(사주 기반)으로 생성됐어요.',
                  hint: '우리 모임 궁합도 이렇게 보고 싶다면',
                  trust: '사주 · 자미두수 · 별자리를 한 앱에서. 우리 모임을 직접 분석하면 케미 지도까지 이어져요.'
                },
                'theme': {
                  // 테마 리포트: name_a 가 "○○님의 <상품명>" 완결 문장 — 접미사 없이 그대로 제목.
                  glyph: '\u{1F58B}', label: '테마 리포트', subjectSuffix: '',
                  titleSuffix: '', acc: '#a78bfa',
                  chip: '\u{1F58B} 테마 리포트',
                  meta: '이 리포트는 만세력 앱 스토어의 테마 리포트(고민 하나를 깊게 파는 단건 리딩)예요.',
                  hint: '내 사주로도 이렇게 만들어 보고 싶다면',
                  trust: '고민별 리포트 15종을 스토어에서. 목차는 같아도 내용은 내 여덟 글자로 전부 달라져요.'
                },
                'gwansang': {
                  // 관상은 name_a 자체가 완결 라벨("관상 보고서") — 타인 사진 케이스가 많아 소유격 없음.
                  glyph: '相', label: 'AI 관상 보고서', subjectSuffix: '',
                  titleSuffix: '', acc: '#7E6034',
                  chip: '🧿 AI 관상 보고서',
                  meta: '이 보고서는 만세력 앱의 관상 분석(온디바이스 관상 + AI 심층)으로 생성됐어요. 얼굴 사진은 포함되지 않아요.',
                  hint: '내 얼굴의 기운도 읽어 보고 싶다면',
                  trust: '사주 · 자미두수 · 별자리에 관상까지 한 앱에서. 셀피 한 장이면 기기 안에서 분석돼요.'
                }
              };
              var b = KIND[d.report_kind] || KIND['fusion'];
              acc = b.acc;
              document.title = d.name_a + b.titleSuffix + ' | 만세력';
              hero += heroTop();
              hero += '<div class="orb">' + b.glyph + '</div>';
              hero += '<div class="brand">만세력 · ' + b.label + '</div>';
              hero += '<div class="subject"><span class="accent">' + esc(d.name_a) + '</span>' + b.subjectSuffix + '</div>';
              hero += '<div class="sig">' + esc(d.one_liner) + '</div>';
              hero += glassChips(b.chip);
              paper += '<div class="report">' + mdToHtml(d.body_md) + '</div>';
              paper += trustCard(b.trust);
              paper += shareRow();
              paper += '<p class="meta">' + b.meta + '<br />공유한 사람이 직접 공개한 결과이며, 링크는 일정 기간 후 만료됩니다.</p>';
              document.getElementById('ctahint').textContent = b.hint;
            } else {
              // 1:1 궁합 스냅샷(비 AI) — 골드 링 점수 + 밴드 스케일(앱 수신 화면과 동일 구간).
              acc = '#E58A80';
              document.title = d.name_a + ' × ' + d.name_b + ' 궁합 | 만세력';
              var pct = Math.max(0, Math.min(100, Number(d.score) || 0));
              var bandIdx = pct >= 80 ? 4 : pct >= 65 ? 3 : pct >= 50 ? 2 : pct >= 35 ? 1 : 0;
              var bandColor = pct >= 65 ? '#6FCF97' : pct >= 50 ? '#AEBECC' : pct >= 35 ? '#D9B978' : '#E58A80';
              var bands = ['어긋남', '주의', '보통', '좋음', '강한 인연'].map(function (lb, i) {
                return i === bandIdx
                  ? '<span class="band on" style="background:' + bandColor + '">' + lb + '</span>'
                  : '<span class="band">' + lb + '</span>';
              }).join('');
              hero += heroTop();
              hero += '<div class="orb">💞</div>';
              hero += '<div class="brand">만세력 · 사주 궁합</div>';
              hero += '<div class="subject"><span class="accent">' + esc(d.name_a) + ' × ' + esc(d.name_b) + '</span>' +
                (d.relation_label ? ' · ' + esc(d.relation_label) : '') + '</div>';
              hero += '<div class="scorering" style="--pct:' + pct + '"><span class="num">' + esc(d.score) + '</span><span class="unit">사주로 본 궁합 점수</span></div>';
              hero += '<div class="bandrow">' + bands + '</div>';
              hero += '<div class="sig">' + esc(d.one_liner) + '</div>';
              hero += glassChips('💞 1:1 궁합' + (d.relation_label ? ' · ' + esc(d.relation_label) : ''));
              if (d.card_url) paper += '<img class="cardimg" alt="궁합 카드" src="' + esc(d.card_url) + '" />';
              paper += trustCard('사주 · 자미두수 · 별자리를 한 앱에서. 내 사주로 보면 관계의 흐름·시기까지 이어져요.');
              paper += shareRow();
              paper += '<p class="meta">공유한 사람이 공개한 결과예요. 만세력 앱에서 내 사주로 직접 궁합을 확인할 수 있어요.</p>';
              document.getElementById('ctahint').textContent = '내 사주로 우리 궁합을 확인하고 싶다면';
            }
            // 종류 액센트 반영 — 본문 헤딩·도트·용어(앱 headingColor)와 히어로 성운 글로우.
            document.documentElement.style.setProperty('--acc', acc);
            document.getElementById('glow').style.background =
              'radial-gradient(closest-side, ' + hexRgba(acc, 0.20) + ', transparent 70%)';
            document.getElementById('heroInner').innerHTML = hero;
            document.getElementById('paperInner').innerHTML = paper;
            sprinkleStars(sid);
            bindCopy();
            document.getElementById('snap').style.display = 'block';
            document.getElementById('ctabtn').setAttribute('href', ctaHref(store, sid));
            document.getElementById('ctabar').style.display = 'block';
            document.getElementById('center').style.display = 'none';
            document.body.style.background = '#0c0c14';
          })
          .catch(function () {
            giftEl.classList.add('off');
            showCenter('결과를 불러올 수 없어요', '네트워크 상태를 확인하거나 잠시 후 다시 시도해 주세요.', store);
          });
        return;
      }

      // ── 씬 링크(구형): 스킴 바운스 → 스토어 ──
      var ref = scene ? ('s_' + scene) : null;
      var STORE = storeUrl(ref);
      var SCHEME = scene ? ('ohhyo://share/' + scene) : null;
      showCenter('만세력', scene ? '내 사주로 직접 확인할 수 있어요.<br />잠시 후 자동으로 이동합니다…' : '사주 · 자미두수 · 별자리 통합 분석', STORE);
      function toStore() { location.href = STORE; }
      if (SCHEME) {
        var timer = setTimeout(toStore, 1500);
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) clearTimeout(timer);
        });
        location.href = SCHEME;
      } else {
        setTimeout(toStore, 800);
      }
    })();
  </script>
</body>
</html>

const $ = s => document.querySelector(s);
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2600);
}

const slug = qs.get("id");

if (!p) location.replace("./#tests");

const r = READERS[p.reader];

const extraFields = STORE_EXTRA_FIELDS[p.slug] || [];

/* 결제 — 토스페이먼츠 직접 연동. 순서는 **주문 먼저, 결제 나중**이다:
   결제 성공 뒤에 입력을 받으면, 결제만 하고 창을 닫은 사용자의 리포트를 만들 근거가 서버에 없다.
   서버(store-report create)가 pending 주문과 결제창 파라미터를 함께 내려준다.

   ⚠️ 토스 결제창은 **인증까지만** 한다 — 승인은 successUrl 로 돌아간 뒤 서버(confirm_web)가
      `/v1/payments/confirm` 을 쳐야 난다. 그래서 여기서 결제가 "끝났다"고 말할 수 없고,
      돌아갈 곳(뷰어)이 승인을 마무리한다. 뒤집으면 좋은 성질이다 — 여기서 이탈하면 돈이 안 빠진다.

   SDK 는 결제를 누른 뒤에만 받는다 — 주문서를 구경만 하는 사람에게 결제 스크립트를 물리지 않는다.
   (엔진 번들 loadEngine 과 같은 지연 로딩 관례.) */
let __tpP = null;
function loadToss() {
  if (__tpP) return __tpP;
  __tpP = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://js.tosspayments.com/v2/standard";
    sc.onload = () => res(window.TossPayments);
    sc.onerror = () => { __tpP = null; rej(new Error("pgsdk")); };
    document.head.appendChild(sc);
  });
  return __tpP;
}

/* 앱 인계 — 이제는 **폴백**이다. 정적 페이지(GitHub Pages)와 서버 플래그(STORE_WEB_ORDERS)는
   따로 배포되므로, 서버가 아직 웹 판매를 안 열었거나 PG 설정이 빠진 순간에도 주문서가 죽지 않게
   앱 결제로 넘긴다. 규약은 그대로다. */
const PLAY_URL = "https://play.google.com/store/apps/details?id=com.samramanshang.manseryeok" +
  "&referrer=utm_source%3Dseo%26utm_medium%3Dweb%26utm_campaign%3Dstore";

/** 인계 payload = `&b_<YYYYMMDD>-<HHMM|na>-<M|F>?<slug>`.
 *
 *  ⚠️ payload 안에 '=' 를 넣으면 안 된다 — 앱 InstallReferrerHandler.extractPayload 는
 *     레퍼러를 '&' 로 쪼갠 뒤 '=' 가 있으면 **뒤쪽만** 취하므로(utm_key=value 규약)
 *     `?t=<slug>` 처럼 쓰면 b_ 접두사를 잃고 인계가 통째로 사라진다. 그래서 '?' 뒤에 값만 붙인다.
 *  구버전 앱은 parseBirthPayload 가 substringBefore('?') 로 끊어내므로 slug 를 조용히 무시하고
 *  생년월일 프리필까지는 그대로 동작한다(하위호환). */
function handoffUrl(v, slug) {
  const pad2 = n => (n < 10 ? "0" : "") + n;
  const date = v.birth.y + pad2(v.birth.mo) + pad2(v.birth.d);
  const time = v.birth.h < 0 ? "na" : (pad2(v.birth.h) + pad2(v.birth.mi));
  return PLAY_URL + encodeURIComponent("&b_" + date + "-" + time + "-" + v.gender + "?" + slug);
}

const HOUR_OPTIONS = `
  <option value="-1">태어난 시 모름</option>
  <option value="0">자시 (23:30~01:30)</option><option value="2">축시 (01:30~03:30)</option>
  <option value="4">인시 (03:30~05:30)</option><option value="6">묘시 (05:30~07:30)</option>
  <option value="8">진시 (07:30~09:30)</option><option value="10">사시 (09:30~11:30)</option>
  <option value="12">오시 (11:30~13:30)</option><option value="14">미시 (13:30~15:30)</option>
  <option value="16">신시 (15:30~17:30)</option><option value="18">유시 (17:30~19:30)</option>
  <option value="20">술시 (19:30~21:30)</option><option value="22">해시 (21:30~23:30)</option>`;

    <div class="sj-row">
      <div class="sj-unit"><input class="sj-input" id="${prefix}Y" type="number" inputmode="numeric" placeholder="1995"><span>연도</span></div>
      <div class="sj-unit"><input class="sj-input" id="${prefix}Mo" type="number" inputmode="numeric" placeholder="1~12"><span>월</span></div>
      <div class="sj-unit"><input class="sj-input" id="${prefix}D" type="number" inputmode="numeric" placeholder="1~31"><span>일</span></div>

}

  </form>`;
}

  return `<h2 class="sec"><span class="no">＋</span>알면 더 깊어지는 것 <small>선택 입력</small></h2>${rows}`;
}

document.getElementById("ck").innerHTML = `
  <a class="pd-back" href="product.html?id=${p.slug}">← ${escHtml(p.title)}</a>
  <div class="ck-prod" style="--c:${c.color}">
    <img src="art/covers/${p.slug}.webp" alt="">
    <div>

      <h1>${escHtml(p.title)}</h1>
      <p class="meta">${r.emoji} ${r.name} 술사 · ${p.chaptersN}장 리포트 · PDF 소장</p>
    </div>
  </div>

  ${personForm("me", "나의 정보", "리포트의 주인공", "이름 (리포트에 불릴 이름)")}
  ${inputType === "pair" ? personForm("pt", "그 사람의 정보", "생년월일이 꼭 필요해", "그 사람 이름·별칭 (선택)") : ""}

  ${extraForm()}

  <h2 class="sec"><span class="no">${inputType === "solo" ? 2 : 3}</span>구성 확인하기</h2>
  <div class="ck-tiers" id="tiers">
    <label class="ck-tier on" data-tier="basic">
      <p class="t1">${escHtml(p.title)} · 사주 분석 리포트</p>
      <p class="t2">${p.chaptersN}장 전체 + 명리 분석지 + PDF 소장 · 구독 아닌 단건</p>
      <p class="pr">${won(priceOf(p.slug))}</p>
    </label>
  </div>

  <label class="ck-agree">
    <input type="checkbox" id="agree">
    <span>이 분석은 명리 계산과 AI 술사 해석에 기반한 <b>참고용·엔터테인먼트 콘텐츠</b>임을 이해했어요. 입력한 생년월일은 리포트 생성에만 쓰여요.${inputType === "pair" || p.slug === "love-sal" ? " (연애·궁합 분석은 만 19세 이상만 신청할 수 있어요)" : ""}</span>
  </label>

  <button class="ck-cta" id="go" data-cta="store-checkout-${p.slug}">${won(priceOf(p.slug))} 결제하고 받기 →</button>
  <p class="ck-fine">카드 결제는 <b>토스페이먼츠</b>를 통해 안전하게 처리돼요 · 카드 정보는 저희 서버에 남지 않아요<br>완성된 리포트는 이 브라우저의 '내 리포트'에 남고, PDF로 저장할 수 있어요 · 1년간 보관돼요<br>
  <a href="../legal/terms/" style="text-decoration:underline">이용약관</a> · <a href="../legal/refund/" style="text-decoration:underline">환불정책</a> · <a href="../legal/privacy/" style="text-decoration:underline">개인정보처리방침</a> · <a href="../legal/business/" style="text-decoration:underline">사업자정보</a></p>
  <p class="ck-err" id="err"></p>

// 성별 토글 배선
const genders = { me: "F", pt: "F" };
["me", "pt"].forEach(prefix => {
  const f = document.getElementById(prefix + "GF"), m = document.getElementById(prefix + "GM");
  if (!f) return;
  [f, m].forEach(btn => btn.addEventListener("click", () => {
    genders[prefix] = btn === f ? "F" : "M";
    f.classList.toggle("on", btn === f);
    m.classList.toggle("on", btn === m);
  }));
});

// 구성은 단건 하나뿐이라 고를 것이 없다(앱 Play 상품과 1:1). 티어 선택 배선은 그래서 없다.

function err(msg) {
  const el = $("#err");
  el.textContent = msg || ""; el.style.display = msg ? "block" : "none";
  if (msg) el.scrollIntoView({ behavior: "smooth", block: "center" });
}

function readPerson(prefix, label, nameRequired) {
  const y = +$("#" + prefix + "Y").value, mo = +$("#" + prefix + "Mo").value, d = +$("#" + prefix + "D").value;
  const hv = +$("#" + prefix + "H").value;
  if (!y || !mo || !d) throw new Error(label + " 생년월일을 채워줘 🌙");
  if (y < 1900 || y > 2026 || mo < 1 || mo > 12 || d < 1 || d > 31) throw new Error(label + " 생년월일을 다시 확인해줘");
  const name = $("#" + prefix + "Name").value.trim();
  if (nameRequired && !name) throw new Error("리포트에 불릴 이름을 넣어줘");
  return { name, gender: genders[prefix], birth: { y, mo, d, h: hv < 0 ? -1 : hv, mi: hv < 0 ? 0 : 30 } };
}

const LON = 126.978; // 서울 기준 — 진태양시 보정은 무료 계산기(/calc/)에서 도시 선택으로 제공

/** 폼 → 서버에 보낼 {inputs, context}. 명식은 브라우저(KMP 엔진)가 세운다 — 서버엔 엔진이 없다.
 *  점수·해석은 보내지 않는다. 명식은 조작해도 남의 사주로 제 돈 내는 짓이라 실익이 없다. */
async function buildOrder(me, partner, pet, extra) {
  await loadEngine();
  const root = engineRoot();
  const now = new Date();
  const nowArgs = [now.getFullYear(), now.getMonth() + 1, now.getDate()];

  const context = {
    me: JSON.parse(root.StoreCalc.context(me.birth.y, me.birth.mo, me.birth.d, me.birth.h, me.birth.mi, me.gender, false, LON, ...nowArgs)),
  };
  if (partner) {
    context.partner = JSON.parse(root.StoreCalc.context(partner.birth.y, partner.birth.mo, partner.birth.d, partner.birth.h, partner.birth.mi, partner.gender, false, LON, ...nowArgs));
    context.gunghap = JSON.parse(root.GunghapCalc.analyze(
      me.birth.y, me.birth.mo, me.birth.d, me.birth.h, me.birth.mi, me.gender,
      partner.birth.y, partner.birth.mo, partner.birth.d, partner.birth.h, partner.birth.mi, partner.gender,
      "COUPLE", now.getFullYear()
    ));
  }
  if (pet) {
    context.pet = { name: pet.name, species: pet.species, birthYear: pet.birthYear, yearGanzi: root.StoreCalc.yearGanzi(pet.birthYear) };
  }

  const inputs = { name: me.name, gender: me.gender, birth: me.birth };
  if (partner) inputs.partner = partner;
  if (pet) inputs.pet = pet;
  if (extra) inputs.extra = extra;
  return { inputs, context };
}

/** 결제창 호출. 돌아갈 곳은 **뷰어**다 — 성공도 실패도 같은 화면에서 만나고, 승인(confirm_web)도
 *  거기 한 곳에만 두면 된다.
 *
 *  성공하면 토스가 successUrl 에 `paymentKey`·`orderId`·`amount` 를 붙여 돌려보내고,
 *  실패하면 failUrl 에 `code`·`message` 를 붙인다. rid 는 우리가 이미 달아 두므로 뷰어는
 *  둘 다 같은 자리에서 읽는다. */
async function pay(order) {
  const TossPayments = await loadToss();
  const pm = order.payment;
  const back = new URL("report.html", location.href);
  back.searchParams.set("rid", order.rid);

  const payment = TossPayments(pm.clientKey).payment({ customerKey: TossPayments.ANONYMOUS });
  await payment.requestPayment({
    method: "CARD",
    amount: { currency: "KRW", value: pm.amount },
    orderId: pm.orderId,
    orderName: pm.orderName,
    successUrl: back.toString(),
    failUrl: back.toString(),
    card: { useEscrow: false, flowMode: "DEFAULT", useCardPoint: false, useAppCardOnly: false },
  });
  // 여기까지 오지 않는다 — 토스가 successUrl/failUrl 로 이동시킨다. 혹시 남으면 뷰어로 보낸다.
  location.href = back.toString();
}

$("#go").addEventListener("click", async () => {
  err("");
  const btn = $("#go");
  const label = btn.textContent;
  let me, partner = null, pet = null, extra = null;
  try {
    if (!$("#agree").checked) throw new Error("안내 사항에 동의해줘 — 체크박스를 눌러줘");
    me = readPerson("me", "나의", true);
    if (inputType === "pair") partner = readPerson("pt", "그 사람의", false);
    if (inputType === "pet") {
      const py = +$("#petYear").value;
      if (!py || py < 1985 || py > 2026) throw new Error("아이가 태어난 해를 넣어줘 (예: 2019)");
      pet = { name: $("#petName").value.trim(), species: $("#petSpecies").value.trim(), birthYear: py };
    }
    if (extraFields.length) {
      extra = {};
      extraFields.forEach(f => {
        const v = +document.getElementById("ex_" + f.key).value;
        if (v >= 1950 && v <= 2035) extra[f.key] = v;
      });
      if (!Object.keys(extra).length) extra = null;
    }
  } catch (e) { err(e.message); return; }

  // 미성년 가드 — 연애·궁합 상품은 앱과 같은 기준(만 19세 미만 차단). 서버도 같은 판정을 한다.
  if ((inputType === "pair" || p.slug === "love-sal") &&
      new Date().getFullYear() - me.birth.y < 19) {
    err("연애·궁합 분석은 만 19세 이상만 신청할 수 있어요");
    return;
  }

  btn.disabled = true;
  btn.textContent = "여덟 글자를 세우는 중…";
  try {
    const { inputs, context } = await buildOrder(me, partner, pet, extra);

    btn.textContent = "주문을 접수하는 중…";
    let order;
    try {
      order = await storeApi({ action: "create", slug: p.slug, tier: "basic", inputs, context });
    } catch (e) {
      // 서버가 웹 판매를 안 열었거나 PG 설정이 빠졌다 — 앱 결제로 넘긴다(이 페이지와 서버 플래그는
      // 따로 배포되므로, 어느 쪽이 먼저 바뀌어도 주문서가 막다른 길이 되지 않게).
      if (e.code === "web_orders_closed" || e.code === "payment_not_configured") {
        btn.textContent = "앱으로 넘기는 중…";
        if (window.__track) window.__track("cta", "store-handoff-" + p.slug);
        location.href = handoffUrl(me, p.slug);
        return;
      }
      throw e;
    }

    // 보관함 기록은 **결제 전에** 남긴다 — 결제하고 창을 닫아도 이 브라우저에 rid 가 남아야
    // '내 리포트'로 되찾을 수 있다(웹 주문의 재열람 키는 rid 하나뿐이다).
    libAdd({ rid: order.rid, slug: p.slug, title: p.title, name: me.name, at: Date.now() });

    // 사전 오픈(무료 모드)이면 결제 단계가 없다 — 바로 뷰어로.
    if (order.status === "paid" || !order.payment) {
      if (window.__track) window.__track("cta", "store-order-" + p.slug);
      location.href = "report.html?rid=" + encodeURIComponent(order.rid);
      return;
    }

    btn.textContent = "결제창을 여는 중…";
    // 라벨을 비운다 — 완주형 이벤트는 track.js 가 유입 채널을 물려 준다(앵글별 전환율 판정용).
    if (window.__track) window.__track("pay_start");
    await pay(order);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = label;
    err(e.code ? storeErrMsg(e)
      : e.message === "engine" ? "계산 엔진을 불러오지 못했어요. 새로고침해줘"
      : e.message === "pgsdk" ? "결제창을 불러오지 못했어요. 네트워크를 확인하고 다시 시도해줘"
      : (e.message || "잠시 후 다시 시도해줘"));
  }
});

// 폼이 보이는 동안 엔진을 미리 받아 둔다.
setTimeout(() => loadEngine().catch(() => {}), 600);
</script>

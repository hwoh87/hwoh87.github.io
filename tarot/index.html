<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>마이타로 — 매일 한 장, 오늘의 타로</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta property="og:title" content="마이타로 — 매일 한 장, 오늘의 타로">
<meta property="og:description" content="픽어카드 · 연애 · 인연 리딩. 무료 타로 앱 마이타로.">
<meta property="og:image" content="https://hwoh87.github.io/MyTarot1/share/og.png">
<!-- 짧은 스토어 링크. 기본 UTM은 틱톡 bio 기준이며 ?s=<source>&c=<campaign> 으로 덮어쓸 수 있다. -->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var src = q.get('s') || 'tiktok';
  var camp = q.get('c') || 'bio';
  var referrer = encodeURIComponent(
    'utm_source=' + src + '&utm_medium=social&utm_campaign=' + camp
  );
  location.replace(
    'https://play.google.com/store/apps/details?id=io.github.hwoh87.mytarot&referrer=' + referrer
  );
})();
</script>
<meta http-equiv="refresh" content="0;url=https://play.google.com/store/apps/details?id=io.github.hwoh87.mytarot&referrer=utm_source%3Dtiktok%26utm_medium%3Dsocial%26utm_campaign%3Dbio">
</head>
<body>
<p><a href="https://play.google.com/store/apps/details?id=io.github.hwoh87.mytarot">마이타로 설치 페이지로 이동 중…</a></p>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3초 안에 하나만 고르세요 · 천지신명 타로</title>
<meta name="description" content="생각하지 말고 눈이 먼저 간 카드를 고르세요. 산신과 도깨비 덱으로 지금 당신에게 온 메시지를 바로 확인할 수 있어요.">
<meta property="og:type" content="website">
<meta property="og:title" content="🔮 3초 안에 하나만 고르세요">
<meta property="og:description" content="눈이 먼저 간 카드를 고르세요. 지금 당신에게 온 메시지.">
<meta property="og:image" content="https://hwoh87.github.io/MyTarot1/share/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  /* 배경 계열은 앱 Eastern(산신과 도깨비) 테마 값 그대로 —
     랜딩이 보여주는 덱이 곧 설치 직후 열리는 덱이라 색이 갈리면 안 된다.
     강조 금색은 덱 아트·숏폼·OG 와 이어지므로 유지한다. */
  :root {
    --bg: #071214;
    --bg2: #0e1e20;
    --surface: #132628;
    --border: rgba(255, 213, 79, 0.25);
    --gold: #ffd54f;
    --text: #f0f2ea;
    --muted: #a9bbb2;
    --accent: #9fd6c2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: radial-gradient(ellipse at 50% -10%, var(--bg2) 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.65;
    padding-bottom: 104px;          /* 하단 고정 설치 바에 가리지 않게 */
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 560px; margin: 0 auto; padding: 26px 20px 8px;
    /* 카드를 화면 세로 중앙에 앉힌다. margin:auto 는 내용이 화면보다 길어지면
       0 으로 접히므로, 결과가 펼쳐져도 윗부분이 잘리지 않는다. */
    min-height: calc(100vh - 116px);
    min-height: calc(100dvh - 116px);
    display: flex; flex-direction: column;
  }
  .stack { margin: auto 0; width: 100%; }

  header { text-align: center; }
  .logo { color: var(--gold); font-size: 26px; letter-spacing: 0.3em; }
  .brand { color: var(--muted); font-size: 12px; letter-spacing: 0.18em; margin-top: 2px; }
  h1 {
    text-align: center; font-size: 24px; color: var(--gold);
    font-weight: 700; margin-top: 22px; letter-spacing: -0.01em;
  }
  .sub { text-align: center; color: var(--muted); font-size: 14px; margin-top: 6px; }

  /* ── 뒷면 3장 ── */
  .row { display: flex; gap: 12px; margin-top: 26px; justify-content: center; }
  .card {
    flex: 1 1 0; max-width: 168px; perspective: 1000px;
    background: none; border: 0; padding: 0; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .card .inner {
    position: relative; width: 100%; aspect-ratio: 397 / 640;
    transform-style: preserve-3d;
    transition: transform .75s cubic-bezier(.2, .75, .2, 1);
  }
  .card.flipped .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 10px; overflow: hidden;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
  }
  .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .face.art { transform: rotateY(180deg); }
  .num {
    text-align: center; color: var(--gold); font-size: 14px;
    margin-top: 8px; font-weight: 700;
  }
  /* 고르지 않은 카드는 조용히 물러난다 */
  .row.done .card:not(.flipped) { opacity: .25; transform: scale(.9); pointer-events: none; }
  .row.done .card:not(.flipped) .num { color: var(--muted); }
  .card, .card .num { transition: opacity .5s ease, transform .5s ease; }
  @media (prefers-reduced-motion: reduce) {
    .card .inner, .card, .card .num { transition: none; }
  }

  /* ── 결과 ── */
  #result { margin-top: 26px; }
  #result[hidden] { display: none; }
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 18px;
  }
  .card-name { font-size: 20px; font-weight: 700; color: var(--gold); }
  .keywords { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .kw {
    font-size: 12px; color: var(--accent); background: rgba(159, 214, 194, 0.12);
    padding: 2px 9px; border-radius: 999px;
  }
  .card-text { font-size: 15px; margin-top: 12px; }
  .again {
    display: block; margin: 14px auto 0; background: none; border: 0;
    color: var(--muted); font-size: 13px; text-decoration: underline;
    cursor: pointer; font-family: inherit;
  }
  .more {
    margin-top: 18px; padding: 22px 18px; text-align: center;
    border: 1px dashed var(--border); border-radius: 16px;
  }
  .more .lead { font-size: 15px; }
  .more .lead b { color: var(--gold); }
  .more .note { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .cta {
    display: inline-block; margin-top: 14px; padding: 13px 24px;
    background: linear-gradient(135deg, #ffd54f, #f0a500);
    color: #241a00; font-weight: 700; text-decoration: none;
    border-radius: 999px; font-size: 15px;
  }

  /* ── 하단 고정 설치 바 ── */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(7, 18, 20, 0.94);   /* --bg 와 같은 색(알파가 있어 변수로 못 쓴다) */
    border-top: 1px solid var(--border);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    backdrop-filter: blur(8px);
  }
  .bar .t { font-size: 13px; line-height: 1.4; }
  .bar .t b { color: var(--gold); }
  .bar .t span { color: var(--muted); display: block; font-size: 12px; }
  .bar a {
    flex: 0 0 auto; padding: 11px 18px; border-radius: 999px;
    background: linear-gradient(135deg, #ffd54f, #f0a500);
    color: #241a00; font-weight: 700; text-decoration: none; font-size: 14px;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="stack">
    <header>
      <div class="logo">✦</div>
      <div class="brand">천지신명 타로</div>
    </header>

    <h1>3초 안에 하나만 고르세요</h1>
    <p class="sub">생각하지 말고, 눈이 먼저 간 카드로.</p>

    <div class="row" id="row"></div>

    <div id="result" hidden></div>
  </div>
</div>

<div class="bar">
  <div class="t"><b>천지신명 타로</b><span>산신·도깨비 덱 · 무료</span></div>
  <a id="barCta" href="#">설치하기</a>
</div>

<!-- 카드 해석 원본은 앱과 같은 생성 파일을 그대로 쓴다(중복 사본을 만들지 않는다). -->
<script src="../MyTarot1/share/data.js"></script>
<script>
(function () {
  "use strict";

  var PACKAGE_ID = "io.github.hwoh87.mytarot";
  var STORE_URL = "https://play.google.com/store/apps/details?id=" + PACKAGE_ID;

  // 랜딩에 실어둔 카드(app/src/main/assets/decks/eastern 에서 추린 12장).
  // 여기 없는 id 를 ?k= 로 넘기면 그림이 없으므로 무시한다.
  var POOL = [2, 6, 9, 10, 17, 19, 22, 36, 39, 41, 50, 64];

  var q = new URLSearchParams(location.search);

  function tag(name, fallback) {
    var v = (q.get(name) || "").replace(/[^A-Za-z0-9_-]/g, "");
    return v ? v.slice(0, 40) : fallback;
  }

  // 유입 출처는 /tarot?s=<플랫폼>&c=<자리> 로 덮어쓴다(기본값은 틱톡 bio).
  // suffix 는 랜딩 안에서의 위치를 갈라 본다 — 카드를 뽑고 누른 건지 그냥 누른 건지.
  function storeUrl(suffix) {
    var camp = tag("c", "bio") + (suffix || "");
    var ref = "utm_source=" + tag("s", "tiktok") +
      "&utm_medium=social&utm_campaign=" + camp;
    return STORE_URL + "&referrer=" + encodeURIComponent(ref);
  }

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function pick3() {
    // ?k=22,39,50 으로 특정 3장을 고정한다(그 편 영상과 카드를 맞출 때).
    var fixed = (q.get("k") || "").split(",")
      .map(function (s) { return parseInt(s, 10); })
      .filter(function (n) { return POOL.indexOf(n) >= 0; });
    if (fixed.length === 3) return fixed;

    var bag = POOL.slice(), out = [];
    while (out.length < 3 && bag.length) {
      out.push(bag.splice(Math.floor(Math.random() * bag.length), 1)[0]);
    }
    return out;
  }

  var row = document.getElementById("row");
  var result = document.getElementById("result");
  document.getElementById("barCta").href = storeUrl("");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function deal() {
    var ids = pick3();
    row.className = "row";
    result.hidden = true;
    result.innerHTML = "";
    row.innerHTML = "";

    ids.forEach(function (id, i) {
      var btn = document.createElement("button");
      btn.className = "card";
      btn.type = "button";
      btn.setAttribute("aria-label", (i + 1) + "번 카드 고르기");
      btn.innerHTML =
        '<div class="inner">' +
          '<div class="face"><img src="back.webp" alt="" decoding="async"></div>' +
          '<div class="face art"><img src="c/' + pad(id) + '.webp" alt="" decoding="async"></div>' +
        '</div>' +
        '<div class="num">' + (i + 1) + '</div>';
      btn.addEventListener("click", function () { reveal(btn, id); });
      row.appendChild(btn);
    });
  }

  function reveal(btn, id) {
    if (row.classList.contains("done")) return;
    row.classList.add("done");
    btn.classList.add("flipped");

    var c = (typeof CARDS !== "undefined") ? CARDS[String(id)] : null;
    if (!c) { return; }                       // 데이터가 안 실렸으면 그림만 보여준다

    result.innerHTML =
      '<div class="panel">' +
        '<div class="card-name">' + esc(c.ko) + '</div>' +
        '<div class="keywords">' +
          (c.upk || []).map(function (k) { return '<span class="kw">' + esc(k) + '</span>'; }).join("") +
        '</div>' +
        '<div class="card-text">' + esc(c.up) + '</div>' +
      '</div>' +
      '<button class="again" type="button">다시 뽑기</button>' +
      '<div class="more">' +
        '<div class="lead">이건 <b>카드 한 장</b>만 본 거예요.</div>' +
        '<div class="note">앱에서는 내 질문을 넣고 여러 장을 펼쳐서<br>' +
          '카드 사이의 연결까지 AI가 읽어줍니다.</div>' +
        '<a class="cta" href="' + esc(storeUrl("_pick")) + '">내 질문으로 뽑아보기</a>' +
      '</div>';
    result.hidden = false;

    result.querySelector(".again").addEventListener("click", deal);
    // 결과가 접힌 화면 밖에 있으면 눈에 들어오게 끌어온다
    setTimeout(function () {
      result.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }, 500);
  }

  deal();
})();
</script>
</body>
</html>
